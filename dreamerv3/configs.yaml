defaults:

  logdir: ~/logdir/{timestamp}
  scratch_dir: ''  # If set, replay buffer goes here instead of logdir (for cluster scratch storage)
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], area: [64, 64], logs: False, use_seed: True, fixed_seed: True, random_spawn: False, egocentric_view: 0, disable_mobs: False, upright_sprites: False, custom_world: ''}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  eval_trajectory:
    num_episodes: 100
    save_path: ''
    load_checkpoint: True

  dream_decode:
    num_batches: 5
    decoder_model: ''
    save_path: ''
    num_episodes: 3
    save_activations: True

  dream_vs_future:
    num_batches: 50
    decoder_model: ''
    save_path: ''
    num_episodes: 3
    warmup: 0    # observed steps before the dream (0 -> report_length//2)
    horizon: 0   # dream rollout length (0 -> imag_length); warmup+horizon <= report_length

  dream_seed_ablation:
    num_batches: 10
    decoder_model: ''
    save_path: ''
    num_episodes: 3
    n_seeds: 16
    warmup: 0         # 0 -> dense over ALL warmups W in [1, report_length-horizon] (mirrors training's dyn.starts); N>0 -> single warmup N
    warmup_stride: 1  # subsample the dense warmup set to control memory/compile
    horizon: 0        # dream rollout length (0 -> imag_length); warmup+horizon <= report_length
    central: median   # curve central tendency: 'median' (spread=IQR) or 'mean' (spread=std)
    shading: band     # spread display: 'band' (filled), 'bars' (error bars), or 'none'
    from_pkl: ''      # replot only: path to a saved dream_seed_ablation_results.pkl (skips agent/rollouts/decode)
    n_example_dreams: 4   # decoded_dreams_by_condition.png: # columns (distinct example dreams) in the 4xN grid; rows are conditions, all seeds drawn per cell (0 disables)
    make_gif: True        # also emit decoded_dreams_animation.gif: 1x4 conditions, one seed (dream) at a time over the real trajectory
    gif_col: 0            # which example column (start/warmup) to animate in the gif (0-indexed into the selected columns)
    gif_fps: 2            # gif frame rate (frames = n_seeds)
    noise_mode: matched   # noise-deter null for conditions C/D: matched | matched_relu | truncnorm | shuffle
    real_style: ghost     # real trajectory in decoded-dream plots: bold (on top) | ghost (thin dashed under dream) | none
    save_activations: False  # also dump raw dream deter per condition -> dream_deter_{A,B,C,D}.pkl (key 'dream_deter', shape (N,H+1,D)) for manifold_analysis.py. streams per-batch to disk (bounded RAM)
    perturb_state: False     # add condition A' (Aprime): real deter + posterior from a seed image whose interoceptive status bar is overwritten with random vitals. Each of the n_seeds gets an independent uniform draw (redrawn per batch) -> A' cross-seed spread measures state-perturbation sensitivity. Adds condition_compare_ADAprime.png (A vs D vs A')
    perturb_vitals: health,food,drink,energy  # which status vitals A' randomizes (comma-sep subset of health,food,drink,energy); each uniform int 0-9
    perturb_pool: 1024       # # of pre-rendered random status-bar strips A' samples from (baked as a constant; sampled with replacement per seed)

  state_probe:
    save_path: ''
    load_checkpoint: True
    num_frames: 8          # distinct scene frames to probe (captured while the real policy plays)
    warmup_steps: 20       # real-policy steps between captured frames (for scene diversity)
    vitals: food,drink,energy   # which crafter vitals to sweep (comma-sep; subset of health,food,drink,energy)
    levels: 0,3,6,9        # grid of values each vital takes (comma-sep ints 0-9); full factorial per frame
    carry_mode: fresh      # fresh: reset recurrent state per probe (clean per-value counterfactual); history: probe from the real drive carry (contextualized, but confounded by the real vitals in the carry)
    from_pkl: ''           # replot only: path to a saved state_probe_results.pkl (skips agent/env)

  replay_activations:
    source_data: ''
    save_path: ''
    load_checkpoint: True
    max_episodes: 0

  inspect_replay:
    save_path: ''
    num_episodes: 5
    num_batches: 2

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    include_position: False
    l1_wm: 0.0
    l1_policy: 0.0
    l1_value: 0.0
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3, rollout_dyn: 0.0}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: relu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0, gru_act: relu, train_noise_std: 0.0, train_noise_where: candidate, require_relu_deter: True}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: relu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: relu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: relu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: relu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: relu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: relu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_batch_size: 6  # # replay sequences dreamed from in report() (dream/seed-ablation blocks); memory ~ linear in this. min'd against batch_size
    report_openloop: True  # compute the openloop reconstruction video in report(). auto-disabled for the dream pipelines (main.py) — video is discarded there
    report_gradnorms: False
    report_dream_feats: False
    report_seed_ablation: False
    report_dump_batch: False   # emit dump/{deter,mu,sd,player_pos,image} for inspect_replay
    seed_ablation_nseeds: 16
    seed_ablation_warmup_stride: 1  # dense-warmup stride for the seed ablation
    seed_ablation_noise_mode: matched  # noise-deter null for C/D: matched (mu+sd*N), matched_relu (clip>=0), truncnorm (N>=0), shuffle (per-dim bootstrap of real deter; preserves marginal+nonneg)
    seed_ablation_perturb_state: False  # emit condition A' (Aprime): real deter + posterior from a status-bar-perturbed seed image. Requires the driver to bake the rendered bar pool onto the model (dream_seed_ablation.py). See dream_seed_ablation.perturb_state
    dream_warmup: 0   # dream_vs_future: observed steps before dream (0->T//2). seed ablation: 0->dense over all warmups, N>0->single warmup N
    dream_horizon: 0  # report dream rollout length (0 -> imag_length). W+H<=report_length
    record_activations: False
    probe_policy: False  # state_probe: also emit policy_logits (over actions) + value from policy()
    mask_visual_k: 0
    mask_visual_invert: False
    mask_visual_prob: False
    mask_recon_loss: True
    rollout_k: 0
    rollout_dyn_scale: 1.0

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

crafter_small:
  task: crafter_reward
  env.crafter.area: [32, 32]
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
